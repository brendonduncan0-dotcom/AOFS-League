name: Advance league

# Started by the website's league controls: the Worker (worker/index.ts, POST /api/advance)
# checks the request, then sends a repository_dispatch event:
#   { event_type: "advance-league",
#     client_payload: { league: "League 2", round: "1", lock: "advance/league-2/round-2" } }
# (round is text: in expressions a number 0 counts as empty, so `0 || inputs.round` would lose it)
# This draws the next round (or finishes the league) with the pairing script and pushes the
# result to v5, which Cloudflare then deploys.
#
# Duplicate presses:
#   - the Worker creates the lock branch first, and a second press for the same step finds it
#     already there, so only one run is started per step; this run deletes the lock at the end
#     (pass or fail), so a failed draw can be pressed again
#   - runs are grouped per league, so leagues never hold each other up or cancel each other
# The script re-checks everything itself:
#   --strict            refuses if any pairing in the current round has no result
#   --expect-round N    does nothing if the league has moved on since the button was pressed
#                       (e.g. a double click), so each round is only drawn once

on:
  repository_dispatch:
    types: [advance-league]
  workflow_dispatch:
    inputs:
      league:
        description: League folder name, e.g. "League 2"
        required: true
      round:
        description: The league's current_round (0 before it starts)
        required: true

# One run at a time per league. GitHub keeps one waiting run per group (a newer one replaces
# it), so only the same league's duplicates can replace each other, and those do nothing anyway.
concurrency:
  group: advance-${{ github.event.client_payload.league || inputs.league }}
  cancel-in-progress: false

jobs:
  advance:
    name: Draw next round
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # passed through env (never pasted into the script), so a league name can't inject commands
      LEAGUE: ${{ github.event.client_payload.league || inputs.league }}
      ROUND: ${{ github.event.client_payload.round || inputs.round }}
      # lock branch from the Worker (none when started by hand)
      LOCK: ${{ github.event.client_payload.lock }}
    steps:
      - name: Check the request
        run: |
          printf 'League: %s\nRound: %s\n' "$LEAGUE" "$ROUND"
          if ! [[ "$ROUND" =~ ^[0-9]{1,3}$ ]]; then echo "::error::Bad round: $ROUND"; exit 1; fi
          if ! printf '%s' "$LEAGUE" | grep -qE "^[[:alnum:]][[:alnum:] '.-]{0,79}$"; then
            echo "::error::Bad league name"; exit 1
          fi
          if [ -n "$LOCK" ] && ! [[ "$LOCK" =~ ^advance/[a-z0-9-]+/(round-[0-9]{1,3}|finish)$ ]]; then
            echo "::error::Bad lock branch"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Draw the next round
        run: npx tsx scripts/pair.ts "$LEAGUE" --strict --expect-round "$ROUND"
      - name: Commit and push
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard content/Leagues)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/Leagues
          league_status=$(grep -m1 '^status:' "content/Leagues/$LEAGUE/$LEAGUE.md" | tr -d '"' | awk '{print $2}')
          current=$(grep -m1 '^current_round:' "content/Leagues/$LEAGUE/$LEAGUE.md" | awk '{print $2}')
          if [ "$league_status" = "Completed" ]; then message="Finish $LEAGUE"; else message="Draw round $current for $LEAGUE"; fi
          git commit -m "$message"
          for attempt in 1 2 3; do
            git pull --rebase origin v5 && git push origin HEAD:v5 && exit 0
            sleep 5
          done
          exit 1
      - name: Release the lock
        # always: after a failure too, so the button can be pressed again
        if: always() && env.LOCK != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$LOCK" =~ ^advance/[a-z0-9-]+/(round-[0-9]{1,3}|finish)$ ]]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${LOCK}" || echo "Lock already gone."
          fi
