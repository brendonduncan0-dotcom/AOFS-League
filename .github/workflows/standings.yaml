name: Standings

# Keeps league standings in the repo in sync with the match notes.
# - Pull requests: check results are valid (no files are changed). Registration PRs from
#   the Worker that only add one player note, or one new league note, are then merged automatically.
# - Pushes to v5: recalculate standings and commit the updated player notes.
# Cloudflare also runs `npm run standings` in its build, so the live site is always
# current; this workflow keeps the repo (and your Obsidian vault, after a pull) in step.

on:
  pull_request:
    paths:
      - "worker/**"
      - "content/Leagues/**"
      - "scripts/**"
      - ".github/workflows/standings.yaml"
  push:
    branches: [v5]
    paths:
      - "worker/**"
      - "content/Leagues/**"
      - "scripts/**"
      - ".github/workflows/standings.yaml"
  workflow_dispatch:

# Never run two standings updates on v5 at once; a newer push supersedes an older one.
concurrency:
  group: standings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check results
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test league scripts and Worker
        run: npx tsx --test scripts/league.test.ts worker/index.test.ts
      - name: Validate results and preview standings
        run: npm run standings -- --dry

  # PRs opened by the Worker merge themselves once "Check results" passes, but only if the PR
  # is a branch in this repo that makes exactly the one change the Worker makes:
  #   register/*       adds one player note:  content/Leagues/<League>/Registered Players/<Name>.md
  #   create-league/*  adds one league note:  content/Leagues/League N/League N.md
  # Anything else is left open for a person to review.
  # Registrations are also re-checked against the league as it is now (scripts/check-registration.ts):
  # if the league moved on while the PR waited (e.g. round 1 was drawn), joined_round is
  # corrected first; if registration has closed since, the PR is left for review.
  automerge:
    name: Auto-merge website change
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'register/') || startsWith(github.head_ref, 'create-league/')) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref }}
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Check the PR only makes the expected change
        id: changes
        run: |
          changes=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[] | "\(.status)\t\(.filename)"')
          printf 'Changes:\n%s\n' "$changes"
          count=$(printf '%s\n' "$changes" | grep -c .)
          status=${changes%%$'\t'*}
          file=${changes#*$'\t'}
          ok=false
          case "$BRANCH" in
            register/*)
              what="add one player note"
              [[ "$file" =~ ^content/Leagues/[^/]+/Registered\ Players/[^/]+\.md$ ]] && ok=true ;;
            create-league/*)
              what="add one league note"
              # content/Leagues/League N/League N.md, with the same N twice
              if [[ "$file" =~ ^content/Leagues/League\ ([1-9][0-9]*)/League\ ([1-9][0-9]*)\.md$ ]] &&
                 [ "${BASH_REMATCH[1]}" = "${BASH_REMATCH[2]}" ]; then ok=true; fi ;;
          esac
          if [ "$count" -ne 1 ] || [ "$status" != "added" ] || [ "$ok" != true ]; then
            echo "::notice::Not auto-merging: this PR does more than ${what}. Leaving it for review."
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: startsWith(github.head_ref, 'register/')
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        if: startsWith(github.head_ref, 'register/')
        with:
          node-version-file: .node-version
          cache: npm
      - if: startsWith(github.head_ref, 'register/')
        run: npm ci --no-audit --no-fund
      - name: Re-check the registration against the league now
        if: startsWith(github.head_ref, 'register/')
        env:
          FILE: ${{ steps.changes.outputs.file }}
        run: |
          league_dir=$(dirname "$(dirname "$FILE")")
          league=$(basename "$league_dir")
          git fetch --depth 1 origin "$BASE"
          git show "origin/${BASE}:${league_dir}/${league}.md" > "$RUNNER_TEMP/league.md"
          set +e
          npx tsx scripts/check-registration.ts "$FILE" "$RUNNER_TEMP/league.md"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::notice::Not auto-merging: registration for ${league} closed while this PR was waiting. Leaving it for review."
            exit 1
          fi
          [ "$code" -eq 0 ] || exit "$code"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            round=$(grep -m1 '^joined_round:' "$FILE" | awk '{print $2}')
            git commit -am "Join from round ${round} (the league moved on while this was waiting)"
            # pushed with the workflow token, so this doesn't start another run of this workflow
            git push origin "HEAD:${BRANCH}"
          fi
      - name: Merge and delete the branch
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
      - name: Update standings on v5
        # A merge made with the workflow token doesn't start other workflows by itself,
        # so start the standings update explicitly.
        run: gh workflow run standings.yaml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.pull_request.base.ref }}"

  update:
    name: Update standings
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Recalculate standings
        run: npm run standings
      - name: Commit updated standings
        run: |
          if git diff --quiet -- content/Leagues; then
            echo "Standings already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/Leagues
          # [skip ci]: Cloudflare already built the site with these standings, so skip a rebuild.
          git commit -m "Update standings [skip ci]"
          # another merge can land between the pull and the push: try a few times
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
